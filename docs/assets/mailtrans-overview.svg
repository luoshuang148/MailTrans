<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">MailTrans: read English emails in Chinese, inside Apple Mail</title>
  <desc id="desc">Illustrated workflow with synthetic English and Chinese email cards. On-device translation preserves layout and lets readers return to the original. This is not an application screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#e0e7ff"/></linearGradient>
    <linearGradient id="line" x2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="57" font-size="14" font-weight="700" letter-spacing="2" fill="#2563eb">MAILTRANS / ON-DEVICE TRANSLATION</text>
    <text x="56" y="105" font-size="34" font-weight="700" fill="#0f172a">Your emails. Your Mac. Your language.</text>
    <text x="56" y="136" font-size="17" fill="#475569">English → Simplified Chinese, right where you already read.</text>
    <rect x="56" y="171" width="480" height="247" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="664" y="171" width="480" height="247" rx="16" fill="#ffffff" stroke="#93c5fd"/>
    <path d="M56 219h480M664 219h480" stroke="#e2e8f0"/>
    <circle cx="79" cy="195" r="5" fill="#cbd5e1"/><circle cx="96" cy="195" r="5" fill="#cbd5e1"/><circle cx="113" cy="195" r="5" fill="#cbd5e1"/>
    <circle cx="687" cy="195" r="5" fill="#cbd5e1"/><circle cx="704" cy="195" r="5" fill="#cbd5e1"/><circle cx="721" cy="195" r="5" fill="#cbd5e1"/>
    <text x="146" y="201" font-size="14" fill="#64748b">Original email</text>
    <text x="754" y="201" font-size="14" fill="#2563eb">Chinese reading view</text>
    <text x="84" y="259" font-size="23" font-weight="650" fill="#0f172a">Thursday workshop briefing</text>
    <text x="84" y="291" font-size="15" fill="#475569">The workshop has moved to Thursday morning.</text>
    <text x="84" y="316" font-size="15" fill="#475569">Please bring the revised schedule.</text>
    <rect x="84" y="341" width="424" height="49" rx="7" fill="#eff6ff"/>
    <text x="100" y="371" font-size="15" fill="#1e40af">Thursday at 10:30 · Conference room 3</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="692" y="259" font-size="23" font-weight="650" fill="#0f172a">周四研讨会简报</text>
      <text x="692" y="291" font-size="15" fill="#475569">研讨会已改至周四上午。</text>
      <text x="692" y="316" font-size="15" fill="#475569">请携带修订后的日程安排。</text>
      <rect x="983" y="182" width="137" height="27" rx="6" fill="#eff6ff"/>
      <text x="1051" y="201" text-anchor="middle" font-size="13" fill="#2563eb">显示原文 ↗</text>
      <rect x="692" y="341" width="424" height="49" rx="7" fill="#eff6ff"/>
      <text x="708" y="371" font-size="15" fill="#1e40af">周四 10:30 · 3 号会议室</text>
    </g>
    <path d="M560 292h77m-12-12 12 12-12 12" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="600" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">LOCAL</text>
    <text x="56" y="457" font-size="14" fill="#475569">Built for Apple Mail · Layout-aware · One-click original</text>
    <text x="1144" y="457" text-anchor="end" font-size="12" fill="#64748b">Illustration · Synthetic content · Not a screenshot</text>
  </g>
</svg>
